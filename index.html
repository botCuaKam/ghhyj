<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tìm kiếm từ ảnh</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f6f9;
    padding: 20px;
}

h1 {
    text-align: center;
}

input[type="file"] {
    margin-bottom: 15px;
}

#searchInput {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    border-radius: 8px;
    border: 1px solid #ccc;
    margin-bottom: 20px;
}

.card {
    background: white;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 8px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

.highlight {
    background: yellow;
}

#status {
    margin: 10px 0;
    color: green;
    font-weight: bold;
}
</style>
</head>
<body>

<h1>Tìm kiếm nội dung từ ảnh</h1>

<input type="file" id="imageInput" accept="image/*">
<div id="status"></div>

<input type="text" id="searchInput" placeholder="Nhập để tìm...">

<div id="results"></div>

<script>

let lines = [];

const imageInput = document.getElementById("imageInput");
const searchInput = document.getElementById("searchInput");
const results = document.getElementById("results");
const status = document.getElementById("status");

imageInput.addEventListener("change", async function() {
    const file = this.files[0];
    if (!file) return;

    status.innerText = "Đang đọc ảnh... vui lòng đợi";
    results.innerHTML = "";
    lines = [];

    const { data: { text } } = await Tesseract.recognize(
        file,
        'vie+eng',
        { logger: m => console.log(m) }
    );

    lines = text.split("\n").filter(line => line.trim() !== "");

    status.innerText = "Đã đọc xong ảnh. Bạn có thể tìm kiếm.";
});

searchInput.addEventListener("input", function() {
    const keyword = this.value.toLowerCase().trim();
    results.innerHTML = "";

    if (!keyword) return;

    const filtered = lines.filter(line =>
        line.toLowerCase().includes(keyword)
    );

    filtered.forEach(line => {
        const div = document.createElement("div");
        div.className = "card";
        div.innerHTML = highlight(line, keyword);
        results.appendChild(div);
    });
});

function highlight(text, keyword) {
    const regex = new RegExp(`(${keyword})`, "gi");
    return text.replace(regex, '<span class="highlight">$1</span>');
}

</script>

</body>
</html>
